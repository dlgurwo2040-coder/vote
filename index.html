<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다면평가자 선정 투표</title>
<style>
  html,body{margin:0;height:100%;background:#f3f5f9;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
  body{display:flex;flex-direction:column}
  .bar{flex:none;display:none;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;background:#fff8e6;border-bottom:1px solid #f0dfb0;font-size:13px;color:#6b5a2a}
  .bar.show{display:flex}
  .bar a{flex:none;padding:7px 12px;border-radius:8px;background:#2f5bd3;color:#fff;font-weight:700;text-decoration:none;font-size:13px}
  .bar button{flex:none;border:0;background:none;color:#998a5c;font-size:18px;padding:0 4px;cursor:pointer}
  iframe{flex:1;width:100%;border:0;display:block;background:#f3f5f9}
</style>
</head>
<body>
<div id="bar" class="bar">
  <span>화면이 안 보이면 →</span>
  <a id="btnExternal" href="#">외부 브라우저로 열기</a>
  <button id="btnClose" aria-label="닫기">×</button>
</div>
<iframe id="app" allow="clipboard-write" referrerpolicy="no-referrer"></iframe>

<script>
  // 기본 연결 주소 (고산초). 다른 학교는 ?id=배포ID 로 접속
  var TARGET = 'https://script.google.com/macros/s/AKfycbwO3z1ETOw02S7cu6riJRYEym3nP6N6I7qdWzv8_AGCIg0ttqWBfirzVDxLkn1nIcQX_A/exec';

  var params = new URLSearchParams(location.search);
  var id = params.get('id');
  if (id && /^[A-Za-z0-9_-]{20,120}$/.test(id)) {
    TARGET = 'https://script.google.com/macros/s/' + id + '/exec';
  }
  params.delete('id');
  var rest = params.toString();
  var url = TARGET + (rest ? '?' + rest : '');

  var ua = navigator.userAgent || '';
  var isKakao = /KAKAOTALK/i.test(ua);
  var isAndroid = /Android/i.test(ua);
  var isOtherInApp = /NAVER\(inapp|BAND\/|Instagram|Line\/|FBAN|FBAV|DaumApps|everytimeApp/i.test(ua);
  var isMobile = /Android|iPhone|iPad|iPod/i.test(ua);

  // PC 브라우저: 투표 화면으로 바로 이동 (안 열리면 시크릿 창 안내)
  if (!isKakao && !isOtherInApp && !isMobile) {
    location.replace(url);
  } else {
    // 카톡·휴대폰: 이 페이지 안에 투표 화면을 띄움 (구글 다중 로그인 오류 회피)
    document.getElementById('app').src = url;
  }

  // 인앱 브라우저에서는 '외부 브라우저로 열기' 비상 버튼 표시
  if (isKakao || (isOtherInApp && isAndroid)) {
    document.getElementById('btnExternal').href = isKakao
      ? 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url)
      : 'intent://' + url.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end';
    document.getElementById('bar').classList.add('show');
  }
  document.getElementById('btnClose').onclick = function () {
    document.getElementById('bar').classList.remove('show');
  };
</script>
</body>
</html>
